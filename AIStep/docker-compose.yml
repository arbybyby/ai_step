services:
  ais.appapi:
    image: ${DOCKER_REGISTRY-}aisappapi
    build:
      context: .
      dockerfile: src/AIS.AppAPI/Dockerfile
    environment:
      - Email__SmtpHost=mailhog
      - Email__SmtpPort=1025
      - Email__From=noreply@ais.local
      - Email__Password=
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_HTTPS_PORTS=
      - ConnectionStrings__SQLite=Data Source=/app/data/AIStep.db
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - dataprotection-keys:/app/DataProtection-Keys
      - ais-db:/app/data
    depends_on:
      - mailhog

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI

volumes:
  dataprotection-keys:
  ais-db:
