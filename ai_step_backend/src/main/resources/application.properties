spring.application.name=ai_step_backend
spring.docker.compose.enabled=false
# Отключаем автоконфигурацию базы данных, используем in-memory хранение
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Logging configuration
logging.level.com.arbybyby.aistep=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
app.jwtSecret=myVerySecureSecretKeyThatIsAtLeast32BytesLongForHMACsha256Algorithm
app.jwtExpirationMs=86400000

# H2 Console (for development)
spring.h2.console.enabled=true