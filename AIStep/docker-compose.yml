services:
  ais.adminpanel:
    image: ${DOCKER_REGISTRY-}aisadminpanel
    build:
      context: .
      dockerfile: src/AIS.AdminPanel/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=https://+:8001;http://+:8000
      - ASPNETCORE_Kestrel__Certificates__Default__Password=DevCertPassword
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/https/aspnetapp.pfx
      - ConnectionStrings__PSQL=Host=db;Port=5432;Database=${POSTGRES_DB:-aisdb};Username=${POSTGRES_USER:-aisuser};Password=${POSTGRES_PASSWORD:-aispassword}
      - Jwt__Secret=${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      - Jwt__Issuer=AIS.AppAPI
      - Jwt__Audience=AIS.Client
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationDays=7
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - ais.db
      - ais.mailhog
    networks:
      - ais-network
    restart: unless-stopped

  ais.appapi:
    image: ${DOCKER_REGISTRY-}aisappapi
    build:
      context: .
      dockerfile: src/AIS.AppAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=DevCertPassword
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/https/aspnetapp.pfx
      - ConnectionStrings__PSQL=Host=db;Port=5432;Database=${POSTGRES_DB:-aisdb};Username=${POSTGRES_USER:-aisuser};Password=${POSTGRES_PASSWORD:-aispassword}
      - Email__SmtpHost=mailhog
      - Email__SmtpPort=1025
      - Email__From=noreply@ais.local
      - Email__Password=
      - Jwt__Secret=${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      - Jwt__Issuer=AIS.AppAPI
      - Jwt__Audience=AIS.Client
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationDays=7
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ais-db:/app/data
    depends_on:
      - ais.mailhog
      - ais.db
      - ais.rabbitmq
    networks:
      - ais-network
    restart: unless-stopped

  ais.db:
    image: postgres:15-alpine
    container_name: ais-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aisuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aispassword}
      - POSTGRES_DB=${POSTGRES_DB:-aisdb}
    ports:
      - "5432:5432"
    volumes:
      - ais-db-data:/var/lib/postgresql/data
    networks:
      - ais-network
    restart: unless-stopped

  ais.mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - ais-network
    restart: unless-stopped

  ais.rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ais-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
        - "5672:5672"
        - "15672:15672"
    volumes:
        - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
        test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
      - ais-network

volumes:
  ais-db:
  ais-db-data:
  rabbitmq_data:

networks:
  ais-network:
    driver: bridge
